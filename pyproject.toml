[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-vcg-tucker"
version = "0.1.0"
description = "Reproducible implementation of VCG myocardial infarction localization with wavelets and Tucker compression"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyWavelets>=1.5",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "seaborn>=0.13",
  "wfdb>=4.1",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
report = ["reportlab>=4.0"]
neural = ["torch>=2.6,<3"]
geometry = ["neurokit2==0.3.0"]
foundation = ["tabpfn==9.2.0"]

[project.scripts]
mi-localization = "mi_localization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mi_localization._vendor.hydra" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
