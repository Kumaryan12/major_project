seed: 42
split_seed: 42
paper_config: configs/paper.yaml
beats_path: data/processed/beats.csv
bank_dir: data/processed/neural_vcg_v1
raw_bank_dir: data/processed/neural_raw_v1
template_bank_dir: data/processed/multiview_vcg_v1
feature_bank_dir: data/processed/tensor_features_v1
output_dir: results/tensor_features_v1
folds_path: configs/patient_folds.csv
classes: [AMI, ALMI, ASMI, IMI, ILMI, HC]
outer_splits: 10
inner_splits: 3
wavelet: sym4
level: 4
dct_coefficients: 16
# Index intervals [start, stop), relative to the original 651-sample crop.
# R is at index 250; these are fixed windows, not clinical delineation.
windows:
  pre: [50, 170]
  central: [170, 350]
  early_post: [350, 470]
  late_post: [470, 651]
chunk_size: 64
feature_counts: [24, 64]
linear_c: [0.1, 1.0]
correlation_threshold: 0.95
