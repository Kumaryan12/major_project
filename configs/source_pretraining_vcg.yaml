seed: 42
version: 1.0.3
base_url: https://physionet-open.s3.amazonaws.com/ptb-xl/1.0.3
metadata_path: data/raw/ptbxl/ptbxl_database.csv
waveform_dir: data/raw/ptbxl
train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
validation_fold: 9
excluded_fold: 10
train_patients: 1024
validation_patients: 128
bank_dir: data/processed/source_pretraining_v1
