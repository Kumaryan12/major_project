  before_r: 250
  after_r: 400
  wavelet: bior6.8
  denoise_level: 9
  rpeak_refractory_ms: 250
  rpeak_integration_ms: 150
  rpeak_threshold_scale: 0.06
device: auto
torch_threads: 2
widths: [16, 32, 64]
pool_bins: 4
batch_size: 128
samples_per_epoch: 4096
learning_rate: 0.001
weight_decay: 0.01
max_epochs: 20
patience: 5
patch_samples: 31
