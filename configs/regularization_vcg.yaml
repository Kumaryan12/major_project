seed: 42
split_seed: 42
training_seeds: [42, 123, 2026]
paper_config: configs/paper.yaml
beats_path: data/processed/beats.csv
bank_dir: data/processed/neural_vcg_v1
output_dir: results/neural_regularization_v1
folds_path: configs/patient_folds.csv
classes: [AMI, ALMI, ASMI, IMI, ILMI, HC]
outer_splits: 10
inner_splits: 3
device: auto
torch_threads: 2
widths: [16, 32, 64]
pool_bins: 4
learning_rate: 0.001
batch_size: 128
samples_per_epoch: 8192
max_epochs: 25
patience: 6
# Order breaks validation ties; no outer-fold or best-seed selection.
candidates:
  - id: baseline
    dropout: 0.2
    weight_decay: 0.01
    label_smoothing: 0.0
    gain_min: 1.0
    gain_max: 1.0
    noise_std: 0.0
  - id: regularized
    dropout: 0.4
    weight_decay: 0.05
    label_smoothing: 0.05
    gain_min: 1.0
    gain_max: 1.0
    noise_std: 0.0
  - id: augmented
    dropout: 0.2
    weight_decay: 0.01
    label_smoothing: 0.0
    gain_min: 0.95
    gain_max: 1.05
    noise_std: 0.005
  - id: combined
    dropout: 0.4
    weight_decay: 0.05
    label_smoothing: 0.05
    gain_min: 0.95
    gain_max: 1.05
    noise_std: 0.005
